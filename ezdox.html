<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ezdox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000;
      overflow-x: hidden;
    }
    .glass {
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .waves svg {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
    }
    .wave1 { animation: waveMove 14s linear infinite; opacity: 0.08; }
    .wave2 { animation: waveMove 20s linear infinite reverse; opacity: 0.05; }
    .wave3 { animation: waveMove 28s linear infinite; opacity: 0.03; }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .content { position: relative; z-index: 10; }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-primary {
      background: #fff;
      color: #000;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: #e5e5e5;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
    }
    .btn-primary:active { transform: translateY(0); }
    input, select, textarea {
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #fff !important;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }
    .field-group { display: none; }
    .field-group.active { display: block; }
    .accent { color: #fff; }
  </style>
</head>
<body class="text-neutral-100 min-h-screen">

  <!-- Waves (monochrome) -->
  <div class="waves">
    <svg class="wave1" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#ffffff" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,138.7C672,128,768,160,864,176C960,192,1056,192,1152,170.7C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
    <svg class="wave2" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#a3a3a3" d="M0,224L48,208C96,192,192,160,288,165.3C384,171,480,213,576,218.7C672,224,768,192,864,170.7C960,149,1056,139,1152,149.3C1248,160,1344,192,1392,208L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
    <svg class="wave3" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#737373" d="M0,288L48,272C96,256,192,224,288,213.3C384,203,480,213,576,229.3C672,245,768,267,864,261.3C960,256,1056,224,1152,208C1248,192,1344,192,1392,192L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>

  <!-- Language -->
  <div class="fixed top-4 right-4 z-50 flex gap-1 content">
    <button onclick="setLang('en')" id="lang-en" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-neutral-800 text-neutral-400">EN</button>
    <button onclick="setLang('fr')" id="lang-fr" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-black">FR</button>
  </div>

  <!-- AUTH -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 content">
    <div class="w-full max-w-md glass rounded-2xl p-8 shadow-2xl fade-in">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold tracking-tight">ezdox</h1>
        <p class="text-neutral-400 mt-2" data-i18n="tagline">Liens personnalisés + analytics IP</p>
      </div>

      <div class="flex gap-2 mb-6">
        <button type="button" id="tab-login" onclick="setMode('login')" class="flex-1 py-2.5 rounded-lg font-medium bg-white text-black transition">
          <span data-i18n="login">Connexion</span>
        </button>
        <button type="button" id="tab-signup" onclick="setMode('signup')" class="flex-1 py-2.5 rounded-lg font-medium bg-neutral-800 text-neutral-300 transition">
          <span data-i18n="signup">Inscription</span>
        </button>
      </div>

      <form onsubmit="doAuth(event)" class="space-y-4">
        <div>
          <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="username">Nom d'utilisateur</label>
          <input id="username" type="text" required minlength="3" maxlength="30" pattern="[a-z0-9_]+" placeholder="votre_nom" autocomplete="username"
                 class="w-full bg-black/60 border border-neutral-700 rounded-xl px-4 py-3 focus:outline-none" />
        </div>
        <div>
          <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="password">Mot de passe</label>
          <input id="password" type="password" required minlength="4" placeholder="••••••••" autocomplete="current-password"
                 class="w-full bg-black/60 border border-neutral-700 rounded-xl px-4 py-3 focus:outline-none" />
        </div>
        <button type="submit" id="submit-btn" class="w-full btn-primary font-medium py-3 rounded-xl">
          <span data-i18n="login">Connexion</span>
        </button>
      </form>
      <p id="error" class="text-red-400 text-sm mt-4 hidden text-center"></p>
      <p class="text-xs text-neutral-500 mt-6 text-center" data-i18n="username_hint">Uniquement lettres, chiffres et underscore</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen content">
    <header class="border-b border-neutral-800 sticky top-0 bg-black/80 backdrop-blur-md z-40">
      <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">ezdox</h1>
        <div class="flex items-center gap-4">
          <span id="whoami" class="text-sm text-neutral-400"></span>
          <button onclick="logout()" class="text-sm text-neutral-400 hover:text-white transition" data-i18n="signout">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <section class="mb-10">
        <h2 class="text-lg font-semibold mb-4" data-i18n="create_link">Créer un lien</h2>
        <div class="glass rounded-2xl p-6">
          <form onsubmit="createLink(event)" class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="slug">Slug</label>
                <div class="flex">
                  <span class="bg-neutral-800 border border-r-0 border-neutral-700 rounded-l-xl px-3 flex items-center text-neutral-400 text-sm">?l=</span>
                  <input id="slug" required pattern="[a-zA-Z0-9_-]{2,40}" placeholder="mon-lien"
                         class="flex-1 bg-black/60 border border-neutral-700 rounded-r-xl px-3 py-2.5 focus:outline-none" />
                </div>
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="title">Titre (optionnel)</label>
                <input id="title" placeholder="Mon super lien"
                       class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="type">Type de lien</label>
              <select id="type" onchange="toggleFields()"
                      class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none">
                <option value="redirect" data-i18n="type_redirect">Redirection</option>
                <option value="embed" data-i18n="type_embed">Intégration (iframe)</option>
                <option value="html" data-i18n="type_html">HTML personnalisé</option>
                <option value="text" data-i18n="type_text">Page texte / message</option>
                <option value="image" data-i18n="type_image">Image / Média</option>
                <option value="bio" data-i18n="type_bio">Page Bio (plusieurs liens)</option>
                <option value="whatsapp" data-i18n="type_whatsapp">WhatsApp</option>
                <option value="telegram" data-i18n="type_telegram">Telegram</option>
              </select>
            </div>

            <!-- Fields -->
            <div id="fields-redirect" class="field-group active space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="target_url">URL de destination</label>
                <input id="url" type="url" placeholder="https://example.com" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <div id="fields-embed" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="target_url">URL à intégrer</label>
                <input id="embed-url" type="url" placeholder="https://example.com" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <div id="fields-html" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="custom_html">HTML personnalisé (page complète)</label>
                <textarea id="html" rows="8" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head>...</head>&#10;<body>&#10;  <h1>Mon contenu</h1>&#10;</body>&#10;</html>"
                          class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 font-mono text-sm focus:outline-none"></textarea>
                <p class="text-xs text-neutral-500 mt-1.5" data-i18n="html_hint">Le HTML sera affiché en pleine page (sans notre site)</p>
              </div>
            </div>

            <div id="fields-text" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="text_title">Titre de la page</label>
                <input id="text-title" placeholder="Bienvenue !" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="text_message">Message</label>
                <textarea id="text-message" rows="4" placeholder="Voici mon message..." class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none"></textarea>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="btn_text">Texte du bouton (optionnel)</label>
                  <input id="text-btn" placeholder="Continuer" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="btn_url">Lien du bouton (optionnel)</label>
                  <input id="text-btn-url" type="url" placeholder="https://..." class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
                </div>
              </div>
            </div>

            <div id="fields-image" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="image_url">URL de l'image</label>
                <input id="image-url" type="url" placeholder="https://exemple.com/image.jpg" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="image_caption">Légende (optionnel)</label>
                <input id="image-caption" placeholder="Description" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="image_link">Lien au clic (optionnel)</label>
                <input id="image-link" type="url" placeholder="https://..." class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <div id="fields-bio" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="bio_title">Titre de la page bio</label>
                <input id="bio-title" placeholder="Mon profil" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="bio_links">Liens (un par ligne : Titre | URL)</label>
                <textarea id="bio-links" rows="5" placeholder="Mon site | https://exemple.com&#10;Instagram | https://instagram.com/moi"
                          class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 font-mono text-sm focus:outline-none"></textarea>
              </div>
            </div>

            <div id="fields-whatsapp" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="wa_number">Numéro WhatsApp (avec indicatif)</label>
                <input id="wa-number" placeholder="33612345678" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="wa_message">Message prérempli (optionnel)</label>
                <input id="wa-message" placeholder="Bonjour !" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <div id="fields-telegram" class="field-group space-y-4">
              <div>
                <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="tg_username">Nom d'utilisateur Telegram</label>
                <input id="tg-username" placeholder="monusername" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
              </div>
            </div>

            <!-- Extra -->
            <div class="border-t border-neutral-800 pt-5 mt-2">
              <p class="text-sm text-neutral-400 mb-3" data-i18n="extra_options">Options supplémentaires</p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="link_password">Mot de passe du lien (optionnel)</label>
                  <input id="link-password" type="text" placeholder="laisser vide = public" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
                </div>
                <div>
                  <label class="block text-sm text-neutral-300 mb-1.5" data-i18n="max_clicks">Nombre max de clics (optionnel)</label>
                  <input id="max-clicks" type="number" min="1" placeholder="Illimité" class="w-full bg-black/60 border border-neutral-700 rounded-xl px-3 py-2.5 focus:outline-none" />
                </div>
              </div>
            </div>

            <div>
              <button type="submit" class="btn-primary font-medium px-6 py-2.5 rounded-xl" data-i18n="create_btn">Créer le lien</button>
            </div>
          </form>
          <p id="create-msg" class="text-sm mt-4 hidden"></p>
        </div>
      </section>

      <section>
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold" data-i18n="your_links">Vos liens</h2>
          <button onclick="loadLinks()" class="text-sm text-neutral-400 hover:text-white transition" data-i18n="refresh">Actualiser</button>
        </div>
        <div id="links" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <!-- PUBLIC -->
  <div id="public" class="hidden min-h-screen content">
    <div id="public-content"></div>
  </div>

  <!-- CLICKS MODAL -->
  <div id="clicks-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onclick="if(event.target===this)closeClicks()">
    <div class="glass rounded-2xl w-full max-w-3xl max-h-[80vh] overflow-hidden flex flex-col fade-in">
      <div class="flex justify-between items-center p-5 border-b border-neutral-800">
        <h3 class="font-semibold"><span data-i18n="clicks">Clics</span> — <span id="modal-slug" class="text-white"></span></h3>
        <button onclick="closeClicks()" class="text-2xl text-neutral-400 hover:text-white leading-none">&times;</button>
      </div>
      <div id="clicks-body" class="p-5 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- IP MODAL -->
  <div id="ip-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80" onclick="if(event.target===this)closeIp()">
    <div class="glass rounded-2xl w-full max-w-md p-6 fade-in">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold" data-i18n="ip_details">Détails IP</h3>
        <button onclick="closeIp()" class="text-2xl text-neutral-400 hover:text-white leading-none">&times;</button>
      </div>
      <div id="ip-body" class="text-sm space-y-2"></div>
    </div>
  </div>

  <!-- PASSWORD GATE -->
  <div id="password-gate" class="hidden min-h-screen flex items-center justify-center p-4 content">
    <div class="w-full max-w-sm glass rounded-2xl p-8 text-center">
      <h2 class="text-xl font-semibold mb-2" data-i18n="protected">Lien protégé</h2>
      <p class="text-neutral-400 text-sm mb-6" data-i18n="enter_password">Entrez le mot de passe pour continuer</p>
      <input id="gate-password" type="password" placeholder="Mot de passe"
             class="w-full bg-black/60 border border-neutral-700 rounded-xl px-4 py-3 mb-4 focus:outline-none text-center" />
      <button onclick="checkPassword()" class="w-full btn-primary font-medium py-3 rounded-xl" data-i18n="continue">Continuer</button>
      <p id="gate-error" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>
  </div>

<script>

      url_required: "L'URL est requise", html_required: "Le HTML est requis", delete_confirm: "Supprimer ce lien ?",
      no_clicks: "Aucun clic pour le moment.", copied: "Copié !", redirecting: "Redirection...", not_found: "Lien introuvable",
      invalid_link: "Lien invalide", protected: "Lien protégé", enter_password: "Entrez le mot de passe pour continuer",
      continue: "Continuer", wrong_pass: "Mot de passe incorrect", expired: "Ce lien a expiré"
    }
  };

  let currentLang = localStorage.getItem("ezdox_lang") || "fr";

  function t(key) {
    return translations[currentLang][key] || translations.en[key] || key;
  }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem("ezdox_lang", lang);
    document.documentElement.lang = lang;
    $("lang-en").className = lang === "en" ? "px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-black" : "px-3 py-1.5 rounded-lg text-sm font-medium bg-neutral-800 text-neutral-400";
    $("lang-fr").className = lang === "fr" ? "px-3 py-1.5 rounded-lg text-sm font-medium bg-white text-black" : "px-3 py-1.5 rounded-lg text-sm font-medium bg-neutral-800 text-neutral-400";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (translations[lang][key]) el.textContent = translations[lang][key];
    });
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    const btn = $("submit-btn");
    if (btn) {
      const span = btn.querySelector("span");
      if (span) span.textContent = mode === "login" ? t("login") : t("signup");
      else btn.textContent = mode === "login" ? t("login") : t("signup");
    }
  }

  const SUPABASE_URL = "https://vibhkrebjiwvawpschdz.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpYmhrcmViaml3dmF3cHNjaGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzYzNjgsImV4cCI6MjEwNTc1MjM2OH0._DfDXhnUaM4ARqKvgasPS1tRI7oJLRt2usuAWTod840";
  const IPINFO_TOKEN = "21a839a5a7f5a7";

  let sb = null;
  let currentUser = null;
  let mode = "login";
  let pendingLink = null;

  function $(id) { return document.getElementById(id); }
  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  function setMode(m) {
    mode = m;
    $("tab-login").className = m === "login" ? "flex-1 py-2.5 rounded-lg font-medium bg-white text-black transition" : "flex-1 py-2.5 rounded-lg font-medium bg-neutral-800 text-neutral-300 transition";
    $("tab-signup").className = m === "signup" ? "flex-1 py-2.5 rounded-lg font-medium bg-white text-black transition" : "flex-1 py-2.5 rounded-lg font-medium bg-neutral-800 text-neutral-300 transition";
    updateSubmitBtn();
    hide($("error"));
  }

  function toggleFields() {
    const type = $("type").value;
    document.querySelectorAll(".field-group").forEach(el => el.classList.remove("active"));
    const map = {
      redirect: "fields-redirect", embed: "fields-embed", html: "fields-html",
      text: "fields-text", image: "fields-image", bio: "fields-bio",
      whatsapp: "fields-whatsapp", telegram: "fields-telegram"
    };
    if (map[type]) $(map[type]).classList.add("active");
  }

  window.onload = async function () {
    setLang(currentLang);
    const params = new URLSearchParams(location.search);
    const slug = params.get("l") || params.get("slug");
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (slug) {
      hide($("auth-screen"));
      hide($("dashboard"));
      await handlePublic(slug);
      return;
    }

    const saved = localStorage.getItem("ezdox_user");
    if (saved) {
      try {
        currentUser = JSON.parse(saved);
        showDash();
        return;
      } catch(e) {}
    }
    show($("auth-screen"));
  };

  async function doAuth(e) {
    e.preventDefault();
    const username = $("username").value.trim().toLowerCase();
    const password = $("password").value;
    const err = $("error");
    hide(err);

    if (!/^[a-zA-Z0-9_]+$/.test(username) || username.length < 3) {
      err.textContent = t("username_hint");
      show(err);
      return;
    }

    try {
      if (mode === "login") {
        const { data, error } = await sb.from("accounts").select("id, username, password").eq("username", username).single();
        if (error || !data || data.password !== password) {
          err.textContent = t("wrong_credentials");
          show(err);
          return;
        }
        currentUser = { id: data.id, username: data.username };
        localStorage.setItem("ezdox_user", JSON.stringify(currentUser));
        showDash();
      } else {
        const { data: existing } = await sb.from("accounts").select("id").eq("username", username).maybeSingle();
        if (existing) {
          err.textContent = t("username_taken");
          show(err);
          return;
        }
        const { data, error } = await sb.from("accounts").insert({ username, password }).select("id, username").single();
        if (error) {
          err.textContent = error.message || "Error";
          show(err);
          return;
        }
        currentUser = { id: data.id, username: data.username };
        localStorage.setItem("ezdox_user", JSON.stringify(currentUser));
        showDash();
      }
    } catch (ex) {
      err.textContent = ex.message || "Error";
      show(err);
    }
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem("ezdox_user");
    hide($("dashboard"));
    show($("auth-screen"));
    setMode("login");
    $("username").value = "";
    $("password").value = "";
  }

  function showDash() {
    hide($("auth-screen"));
    show($("dashboard"));
    $("whoami").textContent = currentUser.username;
    loadLinks();
  }

  async function createLink(e) {
    e.preventDefault();
    const slug = $("slug").value.trim().toLowerCase();
    const title = $("title").value.trim();
    const type = $("type").value;
    const linkPassword = $("link-password").value.trim() || null;
    const maxClicks = $("max-clicks").value ? parseInt($("max-clicks").value) : null;
    const msg = $("create-msg");

    let payload = {
      user_id: currentUser.id,
      slug,
      title: title || null,
      type,
      password: linkPassword,
      max_clicks: maxClicks,
      target_url: null,
      custom_html: null,
      meta: null
    };

    if (type === "redirect") {
      const url = $("url").value.trim();
      if (!url) { msg.textContent = t("url_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      payload.target_url = url;
    } else if (type === "embed") {
      const url = $("embed-url").value.trim();
      if (!url) { msg.textContent = t("url_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      payload.target_url = url;
    } else if (type === "html") {
      const html = $("html").value;
      if (!html.trim()) { msg.textContent = t("html_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      payload.custom_html = html;
    } else if (type === "text") {
      payload.meta = JSON.stringify({
        title: $("text-title").value.trim(),
        message: $("text-message").value.trim(),
        btnText: $("text-btn").value.trim(),
        btnUrl: $("text-btn-url").value.trim()
      });
    } else if (type === "image") {
      const img = $("image-url").value.trim();
      if (!img) { msg.textContent = t("url_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      payload.meta = JSON.stringify({
        imageUrl: img,
        caption: $("image-caption").value.trim(),
        link: $("image-link").value.trim()
      });
    } else if (type === "bio") {
      const raw = $("bio-links").value.trim();
      const links = raw.split("\n").filter(l => l.trim()).map(line => {
        const parts = line.split("|").map(p => p.trim());
        return { title: parts[0] || "Link", url: parts[1] || "#" };
      });
      payload.meta = JSON.stringify({
        title: $("bio-title").value.trim() || "Bio",
        links
      });
    } else if (type === "whatsapp") {
      const num = $("wa-number").value.trim().replace(/\D/g, "");
      if (!num) { msg.textContent = t("url_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      const text = encodeURIComponent($("wa-message").value.trim() || "");
      payload.target_url = `https://wa.me/${num}${text ? "?text=" + text : ""}`;
    } else if (type === "telegram") {
      const user = $("tg-username").value.trim().replace("@", "");
      if (!user) { msg.textContent = t("url_required"); msg.className = "text-sm mt-4 text-red-400"; show(msg); return; }
      payload.target_url = `https://t.me/${user}`;
    }

    const { error } = await sb.from("links").insert(payload);

    if (error) {
      msg.textContent = error.message;
      msg.className = "text-sm mt-4 text-red-400";
    } else {
      const share = location.origin + location.pathname + "?l=" + slug;
      msg.textContent = t("created") + " " + share;
      msg.className = "text-sm mt-4 text-emerald-400";
      e.target.reset();
      toggleFields();
      loadLinks();
    }
    show(msg);
  }

  async function loadLinks() {
    const box = $("links");
    box.innerHTML = `<p class="text-neutral-500">${t("loading")}</p>`;

    const { data, error } = await sb.from("links").select("*, clicks(count)").eq("user_id", currentUser.id).order("created_at", { ascending: false });

    if (error) {
      box.innerHTML = `<p class="text-red-400">${error.message}</p>`;
      return;
    }
    if (!data || data.length === 0) {
      box.innerHTML = `<p class="text-neutral-500">${t("no_links")}</p>`;
      return;
    }

    box.innerHTML = data.map(l => {
      const count = l.clicks?.[0]?.count || 0;
      const share = location.origin + location.pathname + "?l=" + l.slug;
      return `
        <div class="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 fade-in">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-medium">${l.title || l.slug}</span>
              <span class="text-xs px-2 py-0.5 rounded-lg bg-neutral-800 text-neutral-400">${l.type}</span>
              ${l.password ? '<span class="text-xs px-2 py-0.5 rounded-lg bg-neutral-700 text-neutral-300">🔒</span>' : ''}
            </div>
            <a href="${share}" target="_blank" class="text-sm text-neutral-300 hover:text-white underline truncate block mt-1">${share}</a>
          </div>
          <div class="flex gap-2 shrink-0">
            <button onclick="openClicks('${l.id}','${l.slug}')" class="text-sm bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-lg transition">${count} ${t("clicks").toLowerCase()}</button>
            <button onclick="navigator.clipboard.writeText('${share}');alert('${t("copied")}')" class="text-sm bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-lg transition">Copy</button>
            <button onclick="delLink('${l.id}')" class="text-sm text-red-400 hover:text-red-300 px-2 transition">Delete</button>
          </div>
        </div>`;
    }).join("");
  }

  async function delLink(id) {
    if (!confirm(t("delete_confirm"))) return;
    await sb.from("links").delete().eq("id", id);
    loadLinks();
  }

  async function openClicks(id, slug) {
    $("modal-slug").textContent = slug;
    show($("clicks-modal"));
    const body = $("clicks-body");
    body.innerHTML = `<p class="text-neutral-500">${t("loading")}</p>`;

    const { data, error } = await sb.from("clicks").select("*").eq("link_id", id).order("created_at", { ascending: false }).limit(200);
    if (error) { body.innerHTML = `<p class="text-red-400">${error.message}</p>`; return; }
    if (!data?.length) { body.innerHTML = `<p class="text-neutral-500">${t("no_clicks")}</p>`; return; }

    body.innerHTML = `
      <table class="w-full text-sm">
        <thead><tr class="text-left text-neutral-400 border-b border-neutral-700">
          <th class="pb-2 pr-4">Time</th><th class="pb-2 pr-4">IP</th><th class="pb-2">User Agent</th>
        </tr></thead>
        <tbody>
          ${data.map(c => `
            <tr class="border-b border-neutral-800">
              <td class="py-2.5 pr-4 text-neutral-400 whitespace-nowrap">${new Date(c.created_at).toLocaleString()}</td>
              <td class="py-2.5 pr-4"><button onclick="lookupIp('${c.ip||''}')" class="text-white hover:underline font-mono">${c.ip||'unknown'}</button></td>
              <td class="py-2.5 text-neutral-400 truncate max-w-xs">${(c.user_agent||'').slice(0,70)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }
  function closeClicks() { hide($("clicks-modal")); }

  async function lookupIp(ip) {
    if (!ip || ip === "unknown") return;
    show($("ip-modal"));
    const box = $("ip-body");
    box.innerHTML = `<p class="text-neutral-400">${t("loading")}</p>`;
    try {
      const res = await fetch("https://api.ipinfo.io/lite/" + ip, { headers: { Authorization: "Bearer " + IPINFO_TOKEN } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      box.innerHTML = `
        <div class="flex justify-between"><span class="text-neutral-400">IP</span><span class="font-mono">${d.ip}</span></div>
        <div class="flex justify-between"><span class="text-neutral-400">Country</span><span>${d.country||'—'} (${d.country_code||'—'})</span></div>
        <div class="flex justify-between"><span class="text-neutral-400">Continent</span><span>${d.continent||'—'} (${d.continent_code||'—'})</span></div>
        <div class="flex justify-between"><span class="text-neutral-400">ASN</span><span class="font-mono">${d.asn||'—'}</span></div>
        <div class="flex justify-between"><span class="text-neutral-400">Org</span><span>${d.as_name||'—'}</span></div>
        <div class="flex justify-between"><span class="text-neutral-400">Domain</span><span>${d.as_domain||'—'}</span></div>`;
    } catch (e) {
      box.innerHTML = `<p class="text-red-400">Failed: ${e.message}</p>`;
    }
  }
  function closeIp() { hide($("ip-modal")); }

  async function handlePublic(slug) {
    const { data: link, error } = await sb.from("links").select("*").eq("slug", slug).eq("is_active", true).single();

    if (error || !link) {
      show($("public"));
      $("public-content").innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><h1 class="text-4xl font-bold mb-2">404</h1><p class="text-neutral-400">${t("not_found")}</p></div></div>`;
      return;
    }

    if (link.max_clicks) {
      const { count } = await sb.from("clicks").select("*", { count: "exact", head: true }).eq("link_id", link.id);
      if (count >= link.max_clicks) {
        show($("public"));
        $("public-content").innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><h1 class="text-2xl font-bold mb-2">${t("expired")}</h1></div></div>`;
        return;
      }
    }

    if (link.password) {
      pendingLink = link;
      hide($("public"));
      show($("password-gate"));
      return;
    }

    await serveLink(link);
  }

  async function checkPassword() {
    const pass = $("gate-password").value;
    if (!pendingLink || pass !== pendingLink.password) {
      $("gate-error").textContent = t("wrong_pass");
      show($("gate-error"));
      return;
    }
    hide($("password-gate"));
    await serveLink(pendingLink);
  }

  async function serveLink(link) {
    // Log click first
    let ip = "unknown";
    try {
      const r = await fetch("https://api.ipify.org?format=json");
      const j = await r.json();
      ip = j.ip || "unknown";
    } catch (_) {}
    await sb.from("clicks").insert({
      link_id: link.id,
      ip,
      user_agent: navigator.userAgent,
      referer: document.referrer || null
    });

    let meta = {};
    try { if (link.meta) meta = JSON.parse(link.meta); } catch(e) {}

    // HTML type → full page takeover (no site chrome)
    if (link.type === "html" && link.custom_html) {
      document.open();
      document.write(link.custom_html);
      document.close();
      return;
    }

    show($("public"));
    const content = $("public-content");

    if (link.type === "redirect" || link.type === "whatsapp" || link.type === "telegram") {
      content.innerHTML = `<div class="min-h-screen flex items-center justify-center text-neutral-400">${t("redirecting")}</div>`;
      location.replace(link.target_url);
      return;
    }

    if (link.type === "embed") {
      content.innerHTML = `<iframe src="${link.target_url}" class="w-full h-screen border-0" allowfullscreen></iframe>`;
      return;
    }

    if (link.type === "text") {
      content.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-black">
          <div class="max-w-lg w-full glass rounded-2xl p-8 text-center">
            <h1 class="text-2xl font-bold mb-4">${meta.title || ""}</h1>
            <p class="text-neutral-300 mb-6 whitespace-pre-wrap">${meta.message || ""}</p>
            ${meta.btnText && meta.btnUrl ? `<a href="${meta.btnUrl}" class="inline-block btn-primary font-medium px-6 py-3 rounded-xl">${meta.btnText}</a>` : ""}
          </div>
        </div>`;
      return;
    }

    if (link.type === "image") {
      const imgHtml = meta.link
        ? `<a href="${meta.link}"><img src="${meta.imageUrl}" class="max-w-full max-h-[80vh] rounded-xl shadow-2xl" alt="" /></a>`
        : `<img src="${meta.imageUrl}" class="max-w-full max-h-[80vh] rounded-xl shadow-2xl" alt="" />`;
      content.innerHTML = `
        <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-black">
          ${imgHtml}
          ${meta.caption ? `<p class="mt-4 text-neutral-300 text-center">${meta.caption}</p>` : ""}
        </div>`;
      return;
    }

    if (link.type === "bio") {
      const linksHtml = (meta.links || []).map(l =>
        `<a href="${l.url}" target="_blank" class="block w-full glass hover:bg-neutral-800 text-center py-3.5 px-4 rounded-xl transition font-medium">${l.title}</a>`
      ).join("");
      content.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-black">
          <div class="max-w-md w-full space-y-4">
            <h1 class="text-2xl font-bold text-center mb-6">${meta.title || "Bio"}</h1>
            ${linksHtml}
          </div>
        </div>`;
      return;
    }

    content.innerHTML = `<div class="min-h-screen flex items-center justify-center text-neutral-400">${t("invalid_link")}</div>`;
  }
</script>
</body>
</html>
